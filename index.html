<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sopa de Letras</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        h1 { color: #333; }
        .grid { display: grid; grid-template-columns: repeat(6, 40px); gap: 5px; justify-content: center; margin: 20px auto; }
        .cell { width: 40px; height: 40px; background: #fff; border: 2px solid #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; cursor: pointer; border-radius: 5px; }
        .cell.selected { background: #4caf50; color: white; }
        .words { margin-top: 20px; font-size: 16px; color: #555; }
    </style>
</head>
<body>

    <h1>🧩 Mi Sopa de Letras</h1>
    <p>Haz clic en las letras para seleccionar las palabras.</p>

    <div class="grid" id="sopa"></div>

    <div class="words">
        <strong>Palabras a buscar:</strong>
        <p>SOL | LUZ | MAR</p>
    </div>

    <script>
        const letras = [
            ['S', 'O', 'L', 'A', 'B', 'C'],
            ['D', 'E', 'F', 'L', 'U', 'Z'],
            ['M', 'A', 'R', 'G', 'H', 'I'],
            ['J', 'K', 'L', 'M', 'N', 'Ñ'],
            ['O', 'P', 'Q', 'R', 'S', 'T'],
            ['U', 'V', 'W', 'X', 'Y', 'Z']
        ];

        const gridContainer = document.getElementById('sopa');

        letras.forEach(row => {
            row.forEach(char => {
                const div = document.createElement('div');
                div.classList.add('cell');
                div.textContent = char;
                div.onclick = () => div.classList.toggle('selected');
                gridContainer.appendChild(div);
            });
        });
    </script>
</bod</body>
</ht</html>
