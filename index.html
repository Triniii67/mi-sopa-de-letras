<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Sopa de Letras</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f4f4f9;
  margin: 0;
  padding: 15px;
}

h1 {
  margin: 10px 0 15px;
  font-size: 28px;
}

#palabras {
  margin: 10px auto;
  font-weight: bold;
  font-size: 15px;
  max-width: 500px;
  line-height: 1.8;
}

.palabra-item {
  display: inline-block;
  margin: 2px 6px;
}

#sopa {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 3px;
  width: min(92vw, 400px);
  margin: 15px auto;
  touch-action: none;
}

.letra {
  aspect-ratio: 1;
  background: white;
  border: 1px solid #ccc;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: clamp(12px, 4vw, 18px);
}

.letra.seleccionada {
  background: #ffe066;
}

.letra.encontrada {
  background: #8ce99a;
}

#mensaje {
  display: none;
  font-size: 22px;
  color: green;
  font-weight: bold;
  margin: 15px;
}

button {
  padding: 12px 18px;
  font-size: 16px;
  background: #4caf50;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>🧩 Mi Sopa de Letras</h1>

<div id="palabras"></div>

<div id="sopa"></div>

<div id="mensaje">
  ¡Ganaste! 🎉
</div>

<button onclick="nuevaPartida()">
  ✨ Jugar otra ronda ✨
</button>

<script>

const listaPalabras = [
  "TOPH",
  "BEIFONG"
  "ESTRELLA",
  "COMETA",
  "LUNA",
  "MARTE",
  "ESPACIO",
  "TIERRA",
  "OCEANO",
  "BOSQUE",
  "VOLCAN",
  "NUBE",
  "VIENTO",
  "ARENA",
  "FUEGO"
];

const TAMANO = 10;

let palabras = [];
let tablero = [];
let encontradas = new Set();

let inicio = null;
let esPresionado = false;


/* NUEVA PARTIDA */

function nuevaPartida() {

  encontradas.clear();

  document.getElementById("mensaje").style.display = "none";

  palabras = [...listaPalabras]
    .sort(() => Math.random() - 0.5)
    .slice(0, 4);

  const divPalabras = document.getElementById("palabras");

  divPalabras.innerHTML =
    "Palabras: " +
    palabras
      .map(p =>
        `<span class="palabra-item" id="palabra-${p}">${p}</span>`
      )
      .join(" | ");

  tablero = Array(TAMANO)
    .fill(null)
    .map(() => Array(TAMANO).fill(""));

  colocarPalabras();
  rellenarVacios();
  dibujarTablero();
}


/* COLOCAR PALABRAS */

function colocarPalabras() {

  for (let palabra of palabras) {

    let colocada = false;

    while (!colocada) {

      const dF = Math.floor(Math.random() * 3) - 1;
      const dC = Math.floor(Math.random() * 3) - 1;

      if (dF === 0 && dC === 0) continue;

      const f = Math.floor(Math.random() * TAMANO);
      const c = Math.floor(Math.random() * TAMANO);

      if (puedeColocar(palabra, f, c, dF, dC)) {

        for (let i = 0; i < palabra.length; i++) {

          tablero[
            f + i * dF
          ][
            c + i * dC
          ] = palabra[i];

        }

        colocada = true;
      }
    }
  }
}


/* COMPROBAR SI CABE */

function puedeColocar(p, f, c, dF, dC) {

  const finF = f + (p.length - 1) * dF;
  const finC = c + (p.length - 1) * dC;

  if (
    finF < 0 ||
    finF >= TAMANO ||
    finC < 0 ||
    finC >= TAMANO
  ) {
    return false;
  }

  for (let i = 0; i < p.length; i++) {

    const celda =
      tablero[
        f + i * dF
      ][
        c + i * dC
      ];

    if (celda !== "" && celda !== p[i]) {
      return false;
    }
  }

  return true;
}


/* RELLENAR ESPACIOS */

function rellenarVacios() {

  const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  for (let f = 0; f < TAMANO; f++) {

    for (let c = 0; c < TAMANO; c++) {

      if (tablero[f][c] === "") {

        tablero[f][c] =
          letras[
            Math.floor(
              Math.random() * letras.length
            )
          ];
      }
    }
  }
}


/* DIBUJAR TABLERO */

function dibujarTablero() {

  const sopa = document.getElementById("sopa");

  sopa.innerHTML = "";

  for (let f = 0; f < TAMANO; f++) {

    for (let c = 0; c < TAMANO; c++) {

      const div = document.createElement("div");

      div.className = "letra";

      div.dataset.fila = f;
      div.dataset.columna = c;

      div.textContent = tablero[f][c];

      sopa.appendChild(div);
    }
  }
}


/* OBTENER CELDA */

function obtenerCoordenadas(e) {

  let elemento = e.target;

  if (
    e.touches &&
    e.touches.length > 0
  ) {

    elemento = document.elementFromPoint(
      e.touches[0].clientX,
      e.touches[0].clientY
    );
  }

  if (
    elemento &&
    elemento.classList.contains("letra")
  ) {

    return {
      fila: parseInt(elemento.dataset.fila),
      columna: parseInt(elemento.dataset.columna)
    };
  }

  return null;
}


/* COMENZAR */

function iniciarSeleccion(e) {

  e.preventDefault();

  const coords = obtenerCoordenadas(e);

  if (!coords) return;

  esPresionado = true;

  inicio = coords;

  limpiarSeleccion();

  marcarTemporal(inicio, inicio);
}


/* MOVER */

function moverSeleccion(e) {

  if (!esPresionado || !inicio) return;

  e.preventDefault();

  const coords = obtenerCoordenadas(e);

  if (coords) {

    limpiarSeleccion();

    marcarTemporal(
      inicio,
      coords
    );
  }
}


/* TERMINAR */

function finalizarSeleccion(e) {

  if (!esPresionado || !inicio) return;

  e.preventDefault();

  esPresionado = false;

  const coords =
    obtenerCoordenadas(e) || inicio;

  verificarPalabra(
    inicio,
    coords
  );

  limpiarSeleccion();

  inicio = null;
}


/* MARCAR SELECCIÓN TEMPORAL */

function marcarTemporal(a, b) {

  const df = b.fila - a.fila;
  const dc = b.columna - a.columna;

  if (
    df !== 0 &&
    dc !== 0 &&
    Math.abs(df) !== Math.abs(dc)
  ) {
    return;
  }

  const pasoF =
    df === 0 ? 0 : df / Math.abs(df);

  const pasoC =
    dc === 0 ? 0 : dc / Math.abs(dc);

  const distancia =
    Math.max(
      Math.abs(df),
      Math.abs(dc)
    );

  for (let i = 0; i <= distancia; i++) {

    const f =
      a.fila + pasoF * i;

    const c =
      a.columna + pasoC * i;

    const elemento =
      document.querySelector(
        `.letra[data-fila="${f}"][data-columna="${c}"]`
      );

    if (elemento) {
      elemento.classList.add("seleccionada");
    }
  }
}


/* LIMPIAR SELECCIÓN */

function limpiarSeleccion() {

  document
    .querySelectorAll(".letra.seleccionada")
    .forEach(
      elemento =>
        elemento.classList.remove("seleccionada")
    );
}


/* COMPROBAR PALABRA */

function verificarPalabra(a, b) {

  const df = b.fila - a.fila;
  const dc = b.columna - a.columna;

  if (
    df !== 0 &&
    dc !== 0 &&
    Math.abs(df) !== Math.abs(dc)
  ) {
    return;
  }

  const pasoF =
    df === 0 ? 0 : df / Math.abs(df);

  const pasoC =
    dc === 0 ? 0 : dc / Math.abs(dc);

  const distancia =
    Math.max(
      Math.abs(df),
      Math.abs(dc)
    );

  let texto = "";

  for (let i = 0; i <= distancia; i++) {

    texto +=
      tablero[
        a.fila + pasoF * i
      ][
        a.columna + pasoC * i
      ];
  }
