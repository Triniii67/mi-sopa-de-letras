<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopa de Letras Aleatoria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 20px;
    }

    #mensaje-victoria {
      font-size: 26px;
      font-weight: bold;
      color: #2e7d32;
      height: 35px;
      margin-bottom: 10px;
    }

    #palabras-lista {
      margin: 15px auto;
      max-width: 450px;
      display: flex;
      justify-content: center;
      gap: 15px;
      font-weight: bold;
    }

    .palabra-item {
      padding: 5px 10px;
      background: #e0e0e0;
      border-radius: 4px;
    }

    .palabra-item.tachada {
      text-decoration: line-through;
      background: #a5d6a7;
      color: white;
    }

    /* Grid dinámico de 10x10 */
    #sopa-grid {
      display: grid;
      grid-template-columns: repeat(10, 38px);
      gap: 4px;
      justify-content: center;
      margin: 20px auto;
    }

    .celda {
      width: 38px;
      height: 38px;
      background-color: #ffffff;
      border: 2px solid #ccc;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
    }

    .celda.seleccionada {
      background-color: #ffe082;
    }

    .celda.encontrada {
      background-color: #4caf50;
      color: white;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Sopa de Letras</h1>
  <div id="mensaje-victoria"></div>
  
  <p>Encuentra las siguientes palabras:</p>
  <div id="palabras-lista"></div>

  <div id="sopa-grid"></div>

  <button onclick="nuevoJuego()">Jugar de nuevo</button>

  <script>
    // Banco amplio de palabras
    const BANCO_PALABRAS = [
      "TOPH "BEIFONG", "GATO", "ZUKO", "CASA", "ARBOL", "PLAYA", 
      "FLOR", "LIBRO", "FUEGO", "TIGRE", "AGUA", "PIANO", "NUBE"
    ];

    const TAMANO = 10;
    const CANTIDAD_PALABRAS = 4; // Palabras por partida
    
    let tablero = [];
    let palabrasPartida = [];
    let palabrasEncontradas = [];
    let seleccionadas = [];

    function nuevoJuego() {
      document.getElementById('mensaje-victoria').innerText = '';
      palabrasEncontradas = [];
      seleccionadas = [];
      
      // 1. Seleccionar palabras al azar del banco
      const copiaBanco = [...BANCO_PALABRAS].sort(() => 0.5 - Math.random());
      palabrasPartida = copiaBanco.slice(0, CANTIDAD_PALABRAS);

      // 2. Crear matriz vacía
      tablero = Array(TAMANO).fill(null).map(() => Array(TAMANO).fill(''));

      // 3. Insertar palabras en la matriz
      palabrasPartida.forEach(palabra => colocarPalabra(palabra));

      // 4. Rellenar espacios vacíos con letras aleatorias
      const abecedario = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
      for (let r = 0; r < TAMANO; r++) {
        for (let c = 0; c < TAMANO; c++) {
          if (tablero[r][c] === '') {
            tablero[r][c] = abecedario[Math.floor(Math.random() * abecedario.length)];
          }
        }
      }

      renderizarListaPalabras();
      renderizarTablero();
    }

    function colocarPalabra(palabra) {
      const direcciones = [
        [0, 1],  // Horizontal
        [1, 0],  // Vertical
        [1, 1]   // Diagonal
      ];
      
      let colocada = false;
      let intentos = 0;

      while (!colocada && intentos < 100) {
        intentos++;
        const dir = direcciones[Math.floor(Math.random() * direcciones.length)];
        const filaInicio = Math.floor(Math.random() * TAMANO);
        const colInicio = Math.floor(Math.random() * TAMANO);

        const finFila = filaInicio + dir[0] * (palabra.length - 1);
        const finCol = colInicio + dir[1] * (palabra.length - 1);

        if (finFila < TAMANO && finCol < TAMANO) {
          let sePuede = true;
          for (let i = 0; i < palabra.length; i++) {
            const r = filaInicio + dir[0] * i;
            const c = colInicio + dir[1] * i;
            if (tablero[r][c] !== '' && tablero[r][c] !== palabra[i]) {
              sePuede = false;
              break;
            }
          }

          if (sePuede) {
            for (let i = 0; i < palabra.length; i++) {
              const r = filaInicio + dir[0] * i;
              const c = colInicio + dir[1] * i;
              tablero[r][c] = palabra[i];
            }
            colocada = true;
          }
        }
      }
    }

    function renderizarListaPalabras() {
      const listaElem = document.getElementById('palabras-lista');
      listaElem.innerHTML = '';
      palabrasPartida.forEach(p => {
        const item = document.createElement('span');
        item.classList.add('palabra-item');
        item.id = `palabra-${p}`;
        item.innerText = p;
        listaElem.appendChild(item);
      });
    }

    function renderizarTablero() {
      const grid = document.getElementById('sopa-grid');
      grid.innerHTML = '';

      for (let r = 0; r < TAMANO; r++) {
        for (let c = 0; c < TAMANO; c++) {
          const celda = document.createElement('div');
          celda.classList.add('celda');
          celda.innerText = tablero[r][c];
          celda.dataset.row = r;
          celda.dataset.col = c;
          celda.addEventListener('click', () => clickCelda(celda, r, c));
          grid.appendChild(celda);
        }
      }
    }

    function clickCelda(celda, r, c) {
      if (celda.classList.contains('encontrada')) return;

      const idx = seleccionadas.findIndex(s => s.r === r && s.c === c);
      if (idx >= 0) {
        seleccionadas.splice(idx, 1);
        celda.classList.remove('seleccionada');
      } else {
        seleccionadas.push({ r, c, letra: tablero[r][c], elem: celda });
        celda.classList.add('seleccionada');
      }

      verificarPalabras();
    }

    function verificarPalabras() {
      const textoSeleccionado = seleccionadas.map(s => s.letra).join('');
      const textoInvertido = textoSeleccionado.split('').reverse().join('');

      palabrasPartida.forEach(palabra => {
        if (!palabrasEncontradas.includes(palabra)) {
          if (textoSeleccionado === palabra || textoInvertido === palabra) {
            // Palabra encontrada
            palabrasEncontradas.push(palabra);
            document.getElementById(`palabra-${palabra}`).classList.add('tachada');

            seleccionadas.forEach(s => {
              s.elem.classList.remove('seleccionada');
              s.elem.classList.add('encontrada');
            });

            seleccionadas = [];

            // Verificar si ganó todas las palabras
            if (palabrasEncontradas.length === palabrasPartida.length) {
              document.getElementById('mensaje-victoria').innerText = "¡Ganaste!🎉";
            }
          }
        }
      });
    }

    // Iniciar automáticamente al cargar
    nuevoJuego();
  </script>
</body>
</html>
